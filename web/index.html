<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PDF 复习资料阅读器</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --sidebar-w: 300px;
      --primary: #4F46E5;
      --primary-light: #6366F1;
      --bg: #F1F5F9;
      --sidebar-bg: #1E293B;
      --sidebar-text: #CBD5E1;
      --sidebar-hover: #334155;
      --sidebar-active: rgba(79, 70, 229, 0.25);
      --card: #FFFFFF;
      --text: #1E293B;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --danger: #EF4444;
    }

    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      z-index: 100;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar-header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #F8FAFC;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header h1::before {
      content: "📚";
      font-size: 20px;
    }

    .search-box {
      padding: 12px 16px 8px;
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #F8FAFC;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input::placeholder { color: rgba(255,255,255,0.35); }
    .search-box input:focus { border-color: var(--primary-light); }

    .pdf-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .pdf-tree::-webkit-scrollbar { width: 4px; }
    .pdf-tree::-webkit-scrollbar-track { background: transparent; }
    .pdf-tree::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    /* Tree structure */
    .tree-category {
      margin-bottom: 4px;
    }

    .tree-category-title {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      color: #F1F5F9;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
      user-select: none;
    }
    .tree-category-title:hover { background: var(--sidebar-hover); }
    .tree-category-title .arrow {
      margin-right: 8px;
      transition: transform 0.2s;
      font-size: 12px;
    }
    .tree-category-title.expanded .arrow { transform: rotate(90deg); }

    .tree-subcategory {
      margin-left: 12px;
      padding-left: 12px;
      border-left: 2px solid rgba(255,255,255,0.1);
    }

    .tree-subcategory-title {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      color: #94A3B8;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
      user-select: none;
    }
    .tree-subcategory-title:hover { background: var(--sidebar-hover); color: #F1F5F9; }
    .tree-subcategory-title .arrow {
      margin-right: 8px;
      transition: transform 0.2s;
      font-size: 11px;
    }
    .tree-subcategory-title.expanded .arrow { transform: rotate(90deg); }

    .tree-items {
      margin-left: 12px;
      padding-left: 12px;
      border-left: 2px solid rgba(255,255,255,0.06);
    }

    .tree-item {
      padding: 8px 12px;
      color: var(--sidebar-text);
      font-size: 13px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tree-item:hover { background: var(--sidebar-hover); color: #F1F5F9; }
    .tree-item.active { background: var(--sidebar-active); color: #F1F5F9; }

    /* Main content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
    }

    .toolbar {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      min-height: 52px;
      flex-shrink: 0;
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
    }
    .menu-btn:hover { background: var(--bg); }
    .menu-btn svg { width: 22px; height: 22px; }

    .toolbar-title {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .toolbar-controls button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.15s;
    }
    .toolbar-controls button:hover { background: var(--border); }

    .page-info {
      font-size: 13px;
      color: var(--text-secondary);
      min-width: 60px;
      text-align: center;
      white-space: nowrap;
    }

    /* Viewer */
    .viewer {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .viewer canvas {
      max-width: 100%;
      height: auto;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      border-radius: 4px;
      background: #fff;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }
    .empty-icon {
      width: 80px;
      height: 80px;
      background: var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 20px;
    }
    .empty-state h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    .empty-state p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 320px;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--text-secondary);
      font-size: 14px;
      gap: 10px;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Backdrop for mobile */
    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 90;
    }
    .backdrop.active { display: block; }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .menu-btn { display: flex; }
      .toolbar { padding: 10px 12px; }
      .viewer { padding: 12px; }
      .toolbar-controls button { width: 28px; height: 28px; font-size: 14px; }
      .page-info { font-size: 12px; min-width: 50px; }
    }
  </style>
</head>
<body>

    <div class="search-box">

    // Build tree
    function buildTree() {
      el.pdfTree.innerHTML = '';
      const query = el.searchInput.value.trim().toLowerCase();

      pdfStructure.forEach((category, ci) => {
        const catDiv = document.createElement('div');
        catDiv.className = 'tree-category';

        const title = document.createElement('div');
        title.className = 'tree-category-title expanded';
        title.innerHTML = `<span class="arrow">▶</span>${category.name}`;

        const itemsContainer = document.createElement('div');
        itemsContainer.className = 'tree-items';

        if (category.children) {
          category.children.forEach((subcat, si) => {
            const subDiv = document.createElement('div');
            subDiv.className = 'tree-subcategory';

            const subTitle = document.createElement('div');
            subTitle.className = 'tree-subcategory-title expanded';
            subTitle.innerHTML = `<span class="arrow">▶</span>${subcat.name}`;

            const subItems = document.createElement('div');
            subItems.className = 'tree-items';

            subcat.items.forEach((item, ii) => {
              if (query && !item.name.toLowerCase().includes(query) && !subcat.name.toLowerCase().includes(query)) return;
              const itemDiv = document.createElement('div');
              itemDiv.className = 'tree-item';
              itemDiv.textContent = item.name;
              itemDiv.dataset.file = item.file;
              itemDiv.addEventListener('click', () => selectPDF(item.file, item.name));
              subItems.appendChild(itemDiv);
            });

            subTitle.addEventListener('click', () => {
              subTitle.classList.toggle('expanded');
              subItems.style.display = subTitle.classList.contains('expanded') ? '' : 'none';
            });

            subDiv.append(subTitle, subItems);
            itemsContainer.appendChild(subDiv);
          });
        } else if (category.items) {
          category.items.forEach((item) => {
            if (query && !item.name.toLowerCase().includes(query) && !category.name.toLowerCase().includes(query)) return;
            const itemDiv = document.createElement('div');
            itemDiv.className = 'tree-item';
            itemDiv.textContent = item.name;
            itemDiv.dataset.file = item.file;
            itemDiv.addEventListener('click', () => selectPDF(item.file, item.name));
            itemsContainer.appendChild(itemDiv);
          });
        }

        title.addEventListener('click', () => {
          title.classList.toggle('expanded');
          itemsContainer.style.display = title.classList.contains('expanded') ? '' : 'none';
        });

        catDiv.append(title, itemsContainer);
        el.pdfTree.appendChild(catDiv);
      });
    }

    // PDF Viewer
    async function selectPDF(file, name) {
      if (state.currentFile === file) return;

      state.currentFile = file;
      el.toolbarTitle.textContent = name;
      el.toolbarControls.style.display = 'flex';
      el.emptyState.style.display = 'none';

      // Update active state
      document.querySelectorAll('.tree-item').forEach(item => {
        item.classList.toggle('active', item.dataset.file === file);
      });

      el.viewer.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';

      try {
        const url = GITHUB_BASE + encodeURIComponent(file);
        state.currentDoc = await pdfjsLib.getDocument(url).promise;
        state.totalPages = state.currentDoc.numPages;
        state.currentPage = 1;
        state.scale = 1.5;

        await renderAllPages();
        updatePageInfo();

        if (state.isMobile) closeSidebar();
      } catch (err) {
        console.error('Failed to load PDF:', err);
        el.viewer.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h2>加载失败</h2><p>无法打开此 PDF 文件，请检查网络后重试。</p></div>`;
      }
    }

    async function renderAllPages() {
      el.viewer.innerHTML = '';
      const maxScale = Math.min(state.scale, 3);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      for (let i = 1; i <= state.totalPages; i++) {
        const wrapper = document.createElement('div');
        wrapper.dataset.page = i;
        wrapper.style.position = 'relative';
        el.viewer.appendChild(wrapper);

        try {
          const page = await state.currentDoc.getPage(i);
          const viewport = page.getViewport({ scale: maxScale * dpr });

          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.style.width = (viewport.width / dpr) + 'px';
          canvas.style.height = (viewport.height / dpr) + 'px';
          canvas.style.maxWidth = '100%';
          canvas.style.height = 'auto';

          const ctx = canvas.getContext('2d');
          await page.render({ canvasContext: ctx, viewport }).promise;

          wrapper.appendChild(canvas);
        } catch (err) {
          wrapper.innerHTML = `<div style="padding:20px;color:var(--text-secondary);text-align:center;">第 ${i} 页渲染失败</div>`;
        }
      }
    }

    function updatePageInfo() {
      el.pageInfo.textContent = `${state.currentPage} / ${state.totalPages}`;
    }

    // Scroll tracking
    function setupScrollTracking() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const page = parseInt(entry.target.dataset.page);
            if (page && page !== state.currentPage) {
              state.currentPage = page;
              updatePageInfo();
            }
          }
        });
      }, { root: el.viewer, threshold: 0.3 });

      el.viewer.querySelectorAll('[data-page]').forEach(p => observer.observe(p));
    }

    // Controls
    $('prevPage').addEventListener('click', () => {
      if (state.currentPage > 1) {
        state.currentPage--;
        const target = el.viewer.querySelector(`[data-page="${state.currentPage}"]`);
        if (target) target.scrollIntoView({ behavior: 'smooth' });
        updatePageInfo();
      }
    });

    $('nextPage').addEventListener('click', () => {
      if (state.currentPage < state.totalPages) {
        state.currentPage++;
        const target = el.viewer.querySelector(`[data-page="${state.currentPage}"]`);
        if (target) target.scrollIntoView({ behavior: 'smooth' });
        updatePageInfo();
      }
    });

    $('zoomIn').addEventListener('click', async () => {
      if (state.scale >= 3) return;
      state.scale = Math.min(state.scale + 0.25, 3);
      if (state.currentDoc) { await renderAllPages(); setupScrollTracking(); }
    });

    $('zoomOut').addEventListener('click', async () => {
      if (state.scale <= 0.75) return;
      state.scale = Math.max(state.scale - 0.25, 0.75);
      if (state.currentDoc) { await renderAllPages(); setupScrollTracking(); }
    });

    // Sidebar toggle
    function openSidebar() { el.sidebar.classList.add('open'); el.backdrop.classList.add('active'); }
    function closeSidebar() { el.sidebar.classList.remove('open'); el.backdrop.classList.remove('active'); }

    $('menuBtn').addEventListener('click', openSidebar);
    el.backdrop.addEventListener('click', closeSidebar);

    // Search
    el.searchInput.addEventListener('input', buildTree);

    // Keyboard
    document.addEventListener('keydown', (e) => {
      if (!state.currentDoc) return;
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); $('prevPage').click(); }
      else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); $('nextPage').click(); }
      else if (e.key === '+' || e.key === '=') { e.preventDefault(); $('zoomIn').click(); }
      else if (e.key === '-') { e.preventDefault(); $('zoomOut').click(); }
    });

    // Responsive
    window.addEventListener('resize', () => {
      state.isMobile = window.innerWidth <= 768;
      if (!state.isMobile) closeSidebar();
    });

    // Init
    buildTree();
  </script>
</body>
</html>
