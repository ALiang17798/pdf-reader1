<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PDF 复习资料阅读器</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --sidebar-w: 300px;
      --primary: #4F46E5;
      --primary-light: #6366F1;
      --bg: #F1F5F9;
      --sidebar-bg: #1E293B;
      --sidebar-text: #CBD5E1;
      --sidebar-hover: #334155;
      --sidebar-active: rgba(79, 70, 229, 0.25);
      --card: #FFFFFF;
      --text: #1E293B;
      --text-secondary: #64748B;
      --border: #E2E8F0;
    }

    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
    }

    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      z-index: 100;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar-header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #F8FAFC;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header h1::before {
      content: "\1F4DA";
      font-size: 20px;
    }

    .search-box {
      padding: 12px 16px 8px;
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #F8FAFC;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input::placeholder { color: rgba(255,255,255,0.35); }
    .search-box input:focus { border-color: var(--primary-light); }

    .pdf-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .pdf-tree::-webkit-scrollbar { width: 4px; }
    .pdf-tree::-webkit-scrollbar-track { background: transparent; }
    .pdf-tree::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    .tree-category { margin-bottom: 4px; }

    .tree-category-title {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      color: #F1F5F9;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
      user-select: none;
    }
    .tree-category-title:hover { background: var(--sidebar-hover); }
    .tree-category-title .arrow {
      margin-right: 8px;
      transition: transform 0.2s;
      font-size: 12px;
    }
    .tree-category-title.expanded .arrow { transform: rotate(90deg); }

    .tree-subcategory {
      margin-left: 12px;
      padding-left: 12px;
      border-left: 2px solid rgba(255,255,255,0.1);
    }

    .tree-subcategory-title {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      color: #94A3B8;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
      user-select: none;
    }
    .tree-subcategory-title:hover { background: var(--sidebar-hover); color: #F1F5F9; }
    .tree-subcategory-title .arrow {
      margin-right: 8px;
      transition: transform 0.2s;
      font-size: 11px;
    }
    .tree-subcategory-title.expanded .arrow { transform: rotate(90deg); }

    .tree-items {
      margin-left: 12px;
      padding-left: 12px;
      border-left: 2px solid rgba(255,255,255,0.06);
    }

    .tree-item {
      padding: 8px 12px;
      color: var(--sidebar-text);
      font-size: 13px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tree-item:hover { background: var(--sidebar-hover); color: #F1F5F9; }
    .tree-item.active { background: var(--sidebar-active); color: #F1F5F9; }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
    }

    .toolbar {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      min-height: 52px;
      flex-shrink: 0;
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
    }
    .menu-btn:hover { background: var(--bg); }
    .menu-btn svg { width: 22px; height: 22px; }

    .toolbar-title {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pdf-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }
    .empty-icon {
      width: 80px;
      height: 80px;
      background: var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 20px;
    }
    .empty-state h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    .empty-state p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 320px;
    }

    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 90;
    }
    .backdrop.active { display: block; }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .menu-btn { display: flex; }
      .toolbar { padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>复习资料</h1>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索文件...">
    </div>
    <div class="pdf-tree" id="pdfTree"></div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <div class="toolbar">
      <button class="menu-btn" id="menuBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="toolbar-title" id="toolbarTitle">PDF 阅读器</span>
    </div>

    <div id="content" style="flex:1;display:flex;flex-direction:column;min-height:0;">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">&#128196;</div>
        <h2>选择一份资料开始阅读</h2>
        <p>从左侧目录中选择 PDF 文件，即可开始阅读。支持翻页、缩放，手机端完美适配。</p>
      </div>
    </div>
  </main>

  <script>
    const GITHUB_BASE = 'https://aliang17798.github.io/pdf-reader1/pdfs/';

    const pdfStructure = [

              { name: '五 题目', file: 'LK个人理财（五）题目.pdf' },
              { name: '五 答案', file: 'LK个人理财（五）答案.pdf' }
            ]

          {
            name: '独家理财',
            items: [

            ]
          }

      },
      {

          { name: '1、模考金题一（一）', file: '1、模考金题一（一）.pdf' },
          { name: '2、模考金题一（二）', file: '2、模考金题一（二）.pdf' },
          { name: '3、模考金题一（三）', file: '3、模考金题一（三）.pdf' },
          { name: '4、模考金题一（四）', file: '4、模考金题一（四）.pdf' },

          { name: '6、模考金题二（二）', file: '6、模考金题二（二）.pdf' },
          { name: '7、模考金题二（三）', file: '7、模考金题二（三）.pdf' },
          { name: '8、模考金题二（四）', file: '8、模考金题二（四）.pdf' }
        ]
      },
      {
        name: '教材精讲班 讲义',
        dir: '教材精讲班 讲义',
        items: [
          { name: '课程导学', file: '课程导学.pdf' },
          { name: '1、个人理财及相关定义（一）', file: '1、个人理财及相关定义（一）.pdf' },
          { name: '2、个人理财及相关定义（二）', file: '2、个人理财及相关定义（二）.pdf' },
          { name: '3、个人理财业务的发展及原因', file: '3、个人理财业务的发展及原因、理财师的执业资格和要求.pdf' },
          { name: '4、理财师的法律法规基础知识', file: '4、理财师的法律法规基础知识.pdf' },
          { name: '5、理财规划中的法律法规（一）', file: '5、理财规划中的法律法规（一）.pdf' },
          { name: '6、理财规划中的法律法规（二）', file: '6、理财规划中的法律法规（二）.pdf' },
          { name: '7、理财规划中的法律法规（三）', file: '7、理财规划中的法律法规（三）.pdf' },
          { name: '8、银行销售及代理销售产品相关法律法规（一）', file: '8、银行销售及代理销售产品相关法律法规（一）.pdf' },
          { name: '9、银行销售及代理销售产品相关法律法规（二）', file: '9、银行销售及代理销售产品相关法律法规（二）.pdf' },
          { name: '10、银行销售及代理销售产品相关法律法规（三）', file: '10、银行销售及代理销售产品相关法律法规（三）.pdf' },
          { name: '11、银行销售及代理销售产品相关法律法规（四）', file: '11、银行销售及代理销售产品相关法律法规（四）.pdf' },
          { name: '12、银行销售及代理销售产品相关法律法规（五）', file: '12、银行销售及代理销售产品相关法律法规（五）.pdf' },
          { name: '13、银行销售及代理销售产品相关法律法规（六）', file: '13、银行销售及代理销售产品相关法律法规（六）.pdf' },
          { name: '14、银行销售及代理销售产品相关法律法规（七）', file: '14、银行销售及代理销售产品相关法律法规（七）.pdf' },
          { name: '15、银行销售及代理销售产品相关法律法规（八）', file: '15、银行销售及代理销售产品相关法律法规（八）.pdf' },
          { name: '16、银行销售及代理销售产品相关法律法规（九）', file: '16、银行销售及代理销售产品相关法律法规（九）.pdf' },
          { name: '17、金融市场概述', file: '17、金融市场概述.pdf' },
          { name: '18、金融市场分类', file: '18、金融市场分类.pdf' },
          { name: '19、理财投资市场介绍（一）', file: '19、理财投资市场介绍（一）.pdf' },
          { name: '20、理财投资市场介绍（二）', file: '20、理财投资市场介绍（二）.pdf' },
          { name: '21、理财投资市场介绍（三）', file: '21、理财投资市场介绍（三）.pdf' },
          { name: '22、理财投资市场介绍（四）', file: '22、理财投资市场介绍（四）.pdf' },
          { name: '23、理财投资市场介绍（五）', file: '23、理财投资市场介绍（五）.pdf' },
          { name: '24、银行理财产品', file: '24、银行理财产品.pdf' },
          { name: '25、银行代理理财产品（一）', file: '25、银行代理理财产品（一）.pdf' },
          { name: '26、银行代理理财产品（二）', file: '26、银行代理理财产品（二）.pdf' },
          { name: '27、银行代理理财产品（三）', file: '27、银行代理理财产品（三）.pdf' },
          { name: '28、其他理财产品', file: '28、其他理财产品.pdf' },
          { name: '29、客户分类与需求分析', file: '29、客户分类与需求分析.pdf' },
          { name: '30、货币时间价值的基本概念', file: '30、货币时间价值的基本概念.pdf' },
          { name: '31、规则现金流的计算', file: '31、规则现金流的计算.pdf' },
          { name: '32、不规则现金流的计算', file: '32、不规则现金流的计算、理财规划计算工具.pdf' },
          { name: '33、概述、接触客户、建立信任关系', file: '33、概述、接触客户、建立信任关系、分析客户家庭财务现状、明确客户的理财目标.pdf' },
          { name: '34、制定理财规划方案', file: '34、制定理财规划方案、理财规划方案的执行、后续跟踪服务.pdf' }
        ]
      }
    ];

    const state = {
      currentFile: null,
      isMobile: window.innerWidth <= 768,
    };

    const $ = (id) => document.getElementById(id);
    const el = {
      sidebar: $('sidebar'),
      backdrop: $('backdrop'),
      pdfTree: $('pdfTree'),
      content: $('content'),
      emptyState: $('emptyState'),
      toolbarTitle: $('toolbarTitle'),
      searchInput: $('searchInput'),
    };

    function buildTree() {
      el.pdfTree.innerHTML = '';
      const query = el.searchInput.value.trim().toLowerCase();

      pdfStructure.forEach((category) => {
        const catDiv = document.createElement('div');
        catDiv.className = 'tree-category';

        const title = document.createElement('div');
        title.className = 'tree-category-title expanded';
        title.innerHTML = '<span class="arrow">&#9654;</span>' + category.name;

        const itemsContainer = document.createElement('div');
        itemsContainer.className = 'tree-items';

        if (category.children) {
          category.children.forEach((subcat) => {
            const subDiv = document.createElement('div');
            subDiv.className = 'tree-subcategory';

            const subTitle = document.createElement('div');
            subTitle.className = 'tree-subcategory-title expanded';
            subTitle.innerHTML = '<span class="arrow">&#9654;</span>' + subcat.name;

            const subItems = document.createElement('div');
            subItems.className = 'tree-items';

            subcat.items.forEach((item) => {
              if (query && !item.name.toLowerCase().includes(query) && !subcat.name.toLowerCase().includes(query)) return;
              const itemDiv = document.createElement('div');
              itemDiv.className = 'tree-item';
              itemDiv.textContent = item.name;
              itemDiv.dataset.file = item.file;
              itemDiv.addEventListener('click', () => selectPDF(item.file, item.name, category.dir));
              subItems.appendChild(itemDiv);
            });

            subTitle.addEventListener('click', () => {
              subTitle.classList.toggle('expanded');
              subItems.style.display = subTitle.classList.contains('expanded') ? '' : 'none';
            });

            subDiv.append(subTitle, subItems);
            itemsContainer.appendChild(subDiv);
          });
        } else if (category.items) {
          category.items.forEach((item) => {
            if (query && !item.name.toLowerCase().includes(query) && !category.name.toLowerCase().includes(query)) return;
            const itemDiv = document.createElement('div');
            itemDiv.className = 'tree-item';
            itemDiv.textContent = item.name;
            itemDiv.dataset.file = item.file;
            itemDiv.addEventListener('click', () => selectPDF(item.file, item.name, category.dir));
            itemsContainer.appendChild(itemDiv);
          });
        }

        title.addEventListener('click', () => {
          title.classList.toggle('expanded');
          itemsContainer.style.display = title.classList.contains('expanded') ? '' : 'none';
        });

        catDiv.append(title, itemsContainer);
        el.pdfTree.appendChild(catDiv);
      });
    }

    function selectPDF(file, name, dir) {
      if (state.currentFile === file) return;
      state.currentFile = file;

      el.toolbarTitle.textContent = name;

      document.querySelectorAll('.tree-item').forEach(item => {
        item.classList.toggle('active', item.dataset.file === file);
      });

      const path = dir ? dir + '/' + file : file;
      const encodedPath = path.split('/').map(segment => encodeURIComponent(segment)).join('/');
      const url = GITHUB_BASE + encodedPath;

      el.content.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.className = 'pdf-frame';
      iframe.src = url;
      iframe.setAttribute('allowfullscreen', '');
      el.content.appendChild(iframe);

      if (state.isMobile) closeSidebar();
    }

    function openSidebar() { el.sidebar.classList.add('open'); el.backdrop.classList.add('active'); }
    function closeSidebar() { el.sidebar.classList.remove('open'); el.backdrop.classList.remove('active'); }

    $('menuBtn').addEventListener('click', openSidebar);
    el.backdrop.addEventListener('click', closeSidebar);
    el.searchInput.addEventListener('input', buildTree);

    window.addEventListener('resize', () => {
      state.isMobile = window.innerWidth <= 768;
      if (!state.isMobile) closeSidebar();
    });

    buildTree();
  </script>
</body>
</html>
